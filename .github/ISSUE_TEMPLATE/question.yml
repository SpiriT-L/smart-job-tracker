name: "❓ Question"
description: "Задайте вопрос о проекте"
title: "[QUESTION]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## Задайте ваш вопрос
        Прежде чем задать вопрос, пожалуйста, ознакомьтесь с документацией.

  - type: textarea
    id: question
    attributes:
      label: Ваш вопрос
      description: Чётко сформулируйте, что вы хотите узнать
      placeholder: "Как использовать функцию X? Почему происходит Y?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Что вы уже пробовали? Что изучили?
    validations:
      required: false
